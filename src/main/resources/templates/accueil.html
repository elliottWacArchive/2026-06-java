<!-- @format -->

<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{fragments :: head('Accueil')}"></head>
	<body class="font-sans text-neutral-800 bg-white">
		<header th:replace="~{fragments :: hero(true)}"></header>

		<main class="max-w-5xl mx-auto px-6">
			<section class="py-16 text-center max-w-2xl mx-auto">
				<p
					th:if="${config.description}"
					class="text-lg text-neutral-600 leading-relaxed"
					th:text="${config.description}">
					description
				</p>
				<div class="mt-8 flex justify-center gap-4">
					<a
						href="/carte"
						class="bg-accent text-white px-6 py-3 text-sm font-medium hover:opacity-90"
						>Découvrir la carte</a
					>
					<a
						href="/menus"
						class="border border-accent text-accent px-6 py-3 text-sm font-medium hover:bg-accent hover:text-white"
						>Voir les menus</a
					>
				</div>
			</section>

			<section
				class="py-12 border-t border-neutral-100 grid md:grid-cols-3 gap-10 text-center">
				<div>
					<h2 class="font-serif text-xl mb-3">Adresse</h2>
					<p
						class="text-neutral-600 text-sm leading-relaxed"
						th:text="${config.adresse}">
						adresse
					</p>
				</div>
				<div>
					<h2 class="font-serif text-xl mb-3">Horaires</h2>
					<p
						class="text-neutral-600 text-sm leading-relaxed whitespace-pre-line"
						th:text="${config.horaires} ?: 'Non renseignés'">
						horaires
					</p>
				</div>
				<div>
					<h2 class="font-serif text-xl mb-3">Contact</h2>
					<p class="text-neutral-600 text-sm leading-relaxed">
						<span th:if="${config.telephone}" th:text="${config.telephone}"
							>tel</span
						><br th:if="${config.telephone}" />
						<a
							th:if="${config.email}"
							th:href="'mailto:' + ${config.email}"
							class="text-accent hover:underline"
							th:text="${config.email}"
							>email</a
						>
					</p>
				</div>
			</section>

			<section
				class="py-12 border-t border-neutral-100"
				th:if="${!dernieresReviews.isEmpty()}">
				<h2 class="font-serif text-2xl text-center mb-10">Derniers avis</h2>
				<div class="grid md:grid-cols-2 gap-6">
					<div
						th:each="review : ${dernieresReviews}"
						class="border border-neutral-200 p-6">
						<div class="flex items-center justify-between mb-2">
							<p class="font-medium text-sm" th:text="${review.nom}">nom</p>
							<p
								class="text-xs text-neutral-400"
								th:text="${#temporals.format(review.date, 'dd/MM/yyyy')}">
								date
							</p>
						</div>
						<p class="text-accent tracking-wider">
							<span
								th:each="i : ${#numbers.sequence(1, 5)}"
								th:text="${i <= review.note} ? '★' : '☆'"></span>
						</p>
						<p
							class="text-sm text-neutral-600 mt-2"
							th:if="${review.commentaire}"
							th:text="${review.commentaire}">
							commentaire
						</p>
					</div>
				</div>
				<p class="text-center mt-8">
					<a href="/reviews" class="text-accent text-sm hover:underline"
						>Voir tous les avis</a
					>
				</p>
			</section>
		</main>

		<footer th:replace="~{fragments :: footer}"></footer>
	</body>
</html>
