# @format

spring:
  application:
    name: my_restaurant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/my_restaurant}
    username: ${SPRING_DATASOURCE_USERNAME:restaurant}
    password: ${SPRING_DATASOURCE_PASSWORD:restaurant}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  uploads-dir: uploads
